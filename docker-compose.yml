services:
  frame-daily-plan:
    image: ghcr.io/justifytechexpenses/frame-daily-plan:latest
    container_name: frame-daily-plan
    restart: unless-stopped
    # Host networking lets the app find your Frame on the local network.
    network_mode: host
    environment:
      TZ: Europe/London          # your time zone
      # PORT: "8765"             # web page port
      # FRAME_PLAN_PASSWORD: ""  # optional password for the web page
    volumes:
      - ./data:/data
